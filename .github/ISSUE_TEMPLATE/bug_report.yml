name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Security problems belong in a private report, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent is affected?
      multiple: true
      options:
        - Claude
        - OpenAI Codex
        - Cursor
        - Google Gemini / Antigravity
        - GitHub Copilot
        - None / the app itself
  - type: input
    id: version
    attributes:
      label: AI-Usage version
      description: Settings > About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Right-click a tile and use "Copy details", or attach a screenshot. Please remove anything you consider private (email addresses, folder names) before posting.
