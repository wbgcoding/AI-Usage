name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/AiUsage.Tests -c Release

      - name: Test
        run: dotnet test tests/AiUsage.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Build the update signer
        run: dotnet build tools/UpdateSigner -c Release

      - name: Build the review tool
        run: dotnet build tools/ReadmeShots -c Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: tests/AiUsage.Tests/TestResults/*.trx
