name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/AiUsage.Tests -c Release

      - name: Test
        run: dotnet test tests/AiUsage.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Build the review tool
        run: dotnet build tools/ReadmeShots -c Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: tests/AiUsage.Tests/TestResults/*.trx
