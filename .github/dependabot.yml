version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      nuget:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Berlin"
